<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina el Número - Mini Juego</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .game-container {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #667eea;
            margin-bottom: 1rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .number-display {
            font-size: 3rem;
            font-weight: bold;
            color: #764ba2;
            margin: 1rem 0;
        }
        input {
            padding: 12px;
            font-size: 1.2rem;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 10px;
            width: 150px;
            margin: 1rem 0;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            margin: 5px;
            transition: transform 0.3s;
        }
        button:hover {
            transform: scale(1.05);
        }
        .message {
            margin: 1rem 0;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
        }
        .attempts {
            color: #666;
            margin-top: 1rem;
        }
        .reset-btn {
            background: #e74c3c;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <a href="/index.html" class="back-link">← Volver al portafolio</a>
        <h1>🎯 Adivina el Número</h1>
        <p>Adivina el número entre <strong>1 y 100</strong></p>
        
        <div class="number-display" id="guessDisplay">?</div>
        
        <input type="number" id="guessInput" placeholder="Ingresa tu número" min="1" max="100">
        
        <div>
            <button onclick="checkGuess()">🔍 Adivinar</button>
            <button class="reset-btn" onclick="resetGame()">🔄 Reiniciar</button>
        </div>
        
        <div class="message" id="message"></div>
        <div class="attempts" id="attempts">Intentos: 0</div>
    </div>

    <script>
        let secretNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;
        let gameOver = false;

        function checkGuess() {
            if (gameOver) {
                showMessage('¡El juego ya terminó! Presiona Reiniciar', 'error');
                return;
            }

            const input = document.getElementById('guessInput');
            const guess = parseInt(input.value);
            
            if (isNaN(guess) || guess < 1 || guess > 100) {
                showMessage('Por favor ingresa un número entre 1 y 100', 'error');
                return;
            }

            attempts++;
            document.getElementById('attempts').textContent = `Intentos: ${attempts}`;
            document.getElementById('guessDisplay').textContent = guess;

            if (guess === secretNumber) {
                showMessage(`🎉 ¡Felicidades! Adivinaste en ${attempts} intentos. 🎉`, 'success');
                gameOver = true;
            } else if (guess < secretNumber) {
                showMessage(`📈 El número ${guess} es DEMASIADO BAJO. Sigue intentando.`, 'info');
            } else {
                showMessage(`📉 El número ${guess} es DEMASIADO ALTO. Sigue intentando.`, 'info');
            }

            input.value = '';
            input.focus();
        }

        function showMessage(msg, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = msg;
            messageDiv.className = `message ${type}`;
        }

        function resetGame() {
            secretNumber = Math.floor(Math.random() * 100) + 1;
            attempts = 0;
            gameOver = false;
            document.getElementById('attempts').textContent = 'Intentos: 0';
            document.getElementById('guessDisplay').textContent = '?';
            document.getElementById('guessInput').value = '';
            showMessage('¡Juego reiniciado! Adivina el nuevo número', 'info');
        }

        document.getElementById('guessInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkGuess();
        });
    </script>
</body>
</html>
